name: Nightly database backup

# Every night at 03:23 Cairo time (01:23 UTC): an encrypted pg_dump of each database,
# kept as a workflow artifact for 30 days. See docs/BACKUPS.md for setup and restore.
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dot
            secret: DOT_DB_URL
          - name: horusrepair
            secret: HORUS_DB_URL
    env:
      DB_URL: ${{ secrets[matrix.secret] }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::warning::${{ matrix.secret }} or BACKUP_PASSPHRASE is not set; skipping ${{ matrix.name }}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pg_dump 17
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          file="${{ matrix.name }}-$stamp.dump"
          # App data (public), staff/customer logins (auth) and file metadata (storage).
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" -Fc --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage -f "$file"
          ls -lh "$file"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASSPHRASE -in "$file" -out "$file.enc"
          rm "$file"
          echo "FILE=$file.enc" >> "$GITHUB_ENV"
      - name: Menu photos (dot only)
        # Photos live in Supabase Storage, not in the dump. The bucket is public, so each file is
        # fetched by its public URL; the list of names comes from the database.
        if: steps.check.outputs.skip != 'true' && matrix.name == 'dot'
        run: |
          set -euo pipefail
          base="https://avqsypqflrjcylmneycj.supabase.co/storage/v1/object/public/menu"
          mkdir photos
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -At -c "select name from storage.objects where bucket_id = 'menu'" > names.txt
          while IFS= read -r n; do
            [ -n "$n" ] || continue
            mkdir -p "photos/$(dirname "$n")"
            curl -fsS --retry 3 -o "photos/$n" "$base/$(printf '%s' "$n" | jq -sRr @uri | sed 's/%2F/\//g')"
          done < names.txt
          echo "$(wc -l < names.txt) photos"
          tar -czf photos.tgz photos
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASSPHRASE -in photos.tgz -out "${FILE%.dump.enc}-photos.tgz.enc"
          rm -rf photos photos.tgz names.txt
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: ${{ matrix.name }}-backup
          path: |
            ${{ env.FILE }}
            *-photos.tgz.enc
          retention-days: 30
          if-no-files-found: error
